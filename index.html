function dymki(){var P={};try{P=JSON.parse(document.getElementById('przepisy').textContent)}catch(e){return}
var d=document.createElement('div');d.id='dymek';d.hidden=true;d.setAttribute('role','dialog');document.body.appendChild(d);var aktywny=null;
function zamknij(){d.hidden=true;if(aktywny){aktywny.setAttribute('aria-expanded','false');aktywny=null}}
function pokaz(b){var p=P[b.dataset.k];if(!p)return;if(aktywny===b){zamknij();return}zamknij();aktywny=b;b.setAttribute('aria-expanded','true');
d.innerHTML='';var gl=document.createElement('div');gl.className='gl';var t=document.createElement('div');var h=document.createElement('b');h.textContent=p.przepis;var sm=document.createElement('small');sm.textContent=p.akt;t.append(h,sm);
var x=document.createElement('button');x.className='zamk';x.type='button';x.setAttribute('aria-label','Zamknij');x.textContent='×';x.onclick=zamknij;gl.append(t,x);
var tr=document.createElement('div');tr.className='tr';tr.textContent=p.tresc;d.append(gl,tr);
if(p.plik){var a=document.querySelector('a[data-n="'+p.plik+'"]');if(a){var z=document.createElement('button');z.type='button';z.className='zr';z.textContent='Otwórz całą umowę Spółki (PDF)';z.onclick=function(){a.click()};d.append(z)}}
else if(p.url){var l=document.createElement('a');l.className='zr';l.href=p.url;l.target='_blank';l.rel='noopener';l.textContent='Pełny tekst aktu (Dziennik Ustaw, PDF)';d.append(l)}
d.hidden=false;if(innerWidth>=760){var r=b.getBoundingClientRect(),w=d.offsetWidth,lft=Math.min(Math.max(12,r.left+scrollX),scrollX+innerWidth-w-12),top=r.bottom+scrollY+8;
if(r.bottom+d.offsetHeight+16>innerHeight&&r.top>d.offsetHeight+16)top=r.top+scrollY-d.offsetHeight-8;d.style.left=lft+'px';d.style.top=top+'px'}}
document.addEventListener('click',function(e){var b=e.target.closest('.przep');if(b){e.preventDefault();pokaz(b)}else if(!e.target.closest('#dymek'))zamknij()});

function szukaj(){var q=document.getElementById('q');if(!q)return;var norm=function(x){return x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/g,'l')};
q.addEventListener('input',function(){var v=norm(q.value.trim()),ile=0;
document.querySelectorAll('main .dok li, main table tr:not(:first-child), main .decyzje li, main .karta li').forEach(function(e){var ok=!v||norm(e.textContent).indexOf(v)>=0;e.hidden=!ok;if(ok)ile++});
document.querySelectorAll('main section').forEach(function(s){var w=s.querySelectorAll('.dok li:not([hidden]), tr:not(:first-child):not([hidden]), .decyzje li:not([hidden]), .karta li:not([hidden])').length;s.hidden=!!v&&!w&&norm(s.querySelector('h2').textContent).indexOf(v)<0});
document.getElementById('pusto').hidden=!v||ile>0})}
function motyw(){var b=document.getElementById('motyw'),K='u-sailer-motyw',r=document.documentElement;if(!b)return;try{var z=localStorage.getItem(K);if(z)r.dataset.theme=z}catch(e){}
function teraz(){return r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function pokaz(){var ciemny=teraz()==='dark';b.dataset.na=ciemny?'jasny':'ciemny';b.querySelector('span').textContent=ciemny?'Jasny':'Ciemny';b.title=b.ariaLabel=ciemny?'Włącz jasny motyw':'Włącz ciemny motyw'}
b.addEventListener('click',function(){var n=teraz()==='dark'?'light':'dark';r.dataset.theme=n;try{localStorage.setItem(K,n)}catch(e){}pokaz()});pokaz();
var m=document.querySelector('.marka');if(m)m.addEventListener('click',function(e){e.preventDefault();scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});history.replaceState(null,'',location.pathname)})}

function spy(){var L={};document.querySelectorAll('.bok nav a').forEach(function(a){L[a.getAttribute('href').slice(1)]=a});
var o=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){for(var k in L)L[k].classList.toggle('tu',k===e.target.id);var a=L[e.target.id];if(a&&a.scrollIntoView&&innerWidth<1080)a.scrollIntoView({block:'nearest',inline:'nearest'})}})},{rootMargin:'-20% 0px -70% 0px'});
document.querySelectorAll('main section[id]').forEach(function(s){o.observe(s)});var p=document.querySelector('.bok nav a');if(p)p.classList.add('tu')}})();
