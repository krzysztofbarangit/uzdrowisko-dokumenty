<!doctype html><html lang=pl><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=robots content="noindex,nofollow">
<title>Uzdrowisko — dokumenty</title><style>
:root{--tlo:#f5f3ee;--karta:#fff;--tekst:#1d2a26;--szary:#5b6762;--linia:#dcd8cf;--akcent:#1f5a4a;--akcent2:#a8742f;--ostr:#8a2b1f;--ostr-tlo:#fbeae6;--ok:#1f5a4a;--ok-tlo:#e4f0ea;--zolty-tlo:#fbf3df}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--tlo:#151a18;--karta:#1d2421;--tekst:#e6e9e4;--szary:#9aa59f;--linia:#323b37;--akcent:#7cc4a9;--akcent2:#d6a764;--ostr:#f0a596;--ostr-tlo:#3a2320;--ok:#7cc4a9;--ok-tlo:#1f3029;--zolty-tlo:#332c1c}}
:root[data-theme=dark]{--tlo:#151a18;--karta:#1d2421;--tekst:#e6e9e4;--szary:#9aa59f;--linia:#323b37;--akcent:#7cc4a9;--akcent2:#d6a764;--ostr:#f0a596;--ostr-tlo:#3a2320;--ok:#7cc4a9;--ok-tlo:#1f3029;--zolty-tlo:#332c1c}
*{box-sizing:border-box}html{scroll-padding-top:64px}body{margin:0;background:var(--tlo);color:var(--tekst);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:var(--akcent)}h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;line-height:1.25}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
#gate form{background:var(--karta);padding:28px;width:100%;max-width:400px;border-top:5px solid var(--akcent)}
#gate h1{font-size:22px;margin:0 0 6px}#gate p{margin:0 0 16px;color:var(--szary);font-size:14px}
input[type=password]{width:100%;font:inherit;padding:11px;border:1px solid var(--linia);background:var(--tlo);color:var(--tekst)}
#gate label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--szary);margin-top:10px}
#gate button{width:100%;margin-top:14px;font:inherit;font-weight:600;padding:11px;border:0;background:var(--akcent);color:var(--karta);cursor:pointer}
#msg{color:var(--ostr);font-size:14px;min-height:20px;margin-top:8px}
nav{position:sticky;top:0;z-index:5;background:var(--tlo);border-bottom:1px solid var(--linia)}
nav div{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;gap:6px 16px;overflow-x:auto;white-space:nowrap;font-size:14px}
nav a{text-decoration:none;color:var(--szary);font-weight:600}nav a:hover{color:var(--akcent)}
main{max-width:1040px;margin:0 auto;padding:8px 16px 80px}
header h1{font-size:30px;margin:26px 0 6px}header p{margin:0 0 6px;max-width:72ch;color:var(--szary)}.stan{font-size:14px}
section{margin-top:36px}h2{font-size:23px;margin:0 0 4px;padding-top:14px;border-top:2px solid var(--tekst)}h3{font-size:18px;margin:22px 0 6px}
.wstep{margin:0 0 14px;color:var(--szary);max-width:75ch}
.dok{list-style:none;margin:0;padding:0;background:var(--karta);border:1px solid var(--linia)}
.dok li{display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:12px 14px;border-top:1px solid var(--linia);align-items:center}.dok li:first-child{border-top:0}
.dok b{font-weight:600}.dok small{grid-column:1;color:var(--szary);font-size:14px;line-height:1.45}
.dok a[data-f]{grid-column:2;grid-row:1/span 2;font-weight:600;font-size:14px;text-decoration:none;border:1px solid var(--akcent);padding:7px 12px;white-space:nowrap}
.dok a[data-f]:hover{background:var(--akcent);color:var(--karta)}.dok a[data-f].ladowanie{opacity:.5;pointer-events:none}
.dok .brak{grid-column:2;grid-row:1/span 2;font-size:13px;color:var(--szary);border:1px dashed var(--linia);padding:6px 10px;white-space:nowrap}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;margin-left:6px;vertical-align:2px}
.tag.tak{background:var(--ok-tlo);color:var(--ok)}.tag.nie{background:var(--ostr-tlo);color:var(--ostr)}.tag.uw{background:var(--zolty-tlo);color:var(--akcent2)}
.karta{background:var(--karta);border-left:4px solid var(--akcent2);padding:12px 16px;margin:14px 0}.karta.wazne{border-left-color:var(--ostr)}.karta p{margin:6px 0}
.karta ul,.karta ol{margin:6px 0;padding-left:22px}
.tab{width:100%;overflow-x:auto;background:var(--karta);border:1px solid var(--linia)}table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-top:1px solid var(--linia)}th{font-size:13px;color:var(--szary);font-weight:700;border-top:0}
td:first-child{white-space:nowrap;font-weight:600;color:var(--akcent)}
.zrodla{font-size:14px;color:var(--szary)}footer{margin-top:44px;font-size:13px;color:var(--szary);border-top:1px solid var(--linia);padding-top:12px}
@media(max-width:600px){header h1{font-size:24px}.dok li{grid-template-columns:1fr}.dok a[data-f],.dok .brak{grid-column:1;grid-row:auto;justify-self:start;margin-top:4px}td:first-child{white-space:normal}}
</style>

(function(){var P=JSON.parse(document.getElementById('payload').textContent),KL='u-sailer-pw',KEY;
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function klucz(p){var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt'])}
async function otworz(p,pam){KEY=await klucz(p);var h=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},KEY,b64(P.ct)));
try{pam?localStorage.setItem(KL,p):localStorage.removeItem(KL)}catch(e){}
document.getElementById('gate').remove();var a=document.getElementById('app');a.innerHTML=h;a.hidden=false;pliki()}
document.getElementById('f').addEventListener('submit',async function(e){e.preventDefault();var m=document.getElementById('msg');m.textContent='Otwieram…';
try{await otworz(document.getElementById('pw').value,document.getElementById('pam').checked)}catch(x){m.textContent='Nieprawidłowe hasło.'}});
try{var z=localStorage.getItem(KL);if(z)otworz(z,true).catch(function(){try{localStorage.removeItem(KL)}catch(e){}})}catch(e){}
function pliki(){document.querySelectorAll('a[data-f]').forEach(function(a){a.textContent='Otwórz PDF · '+(a.dataset.kb>1024?(a.dataset.kb/1024).toFixed(1).replace('.',',')+' MB':a.dataset.kb+' KB');
a.addEventListener('click',async function(e){e.preventDefault();var w=window.open('','_blank');a.classList.add('ladowanie');
try{var r=await fetch('f/'+a.dataset.f+'.bin',{cache:'no-store'});if(!r.ok)throw 0;var d=new Uint8Array(await r.arrayBuffer());
var pdf=await crypto.subtle.decrypt({name:'AES-GCM',iv:d.slice(0,12)},KEY,d.slice(12));
var u=URL.createObjectURL(new Blob([pdf],{type:'application/pdf'}));
if(w){w.location.href=u}else{var l=document.createElement('a');l.href=u;l.download=a.dataset.n;document.body.appendChild(l);l.click();l.remove()}}
catch(x){if(w)w.close();alert('Nie udało się otworzyć pliku. Odśwież stronę i spróbuj ponownie.')}
a.classList.remove('ladowanie')})})}})();
