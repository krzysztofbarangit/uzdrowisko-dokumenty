*{box-sizing:border-box}html{scroll-padding-top:72px;scroll-behavior:smooth}
body{margin:0;background:var(--tlo);color:var(--tekst);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
::selection{background:var(--akcent);color:var(--karta)}
a{color:var(--akcent);text-underline-offset:3px}:focus-visible{outline:2px solid var(--akcent);outline-offset:2px}
h1,h2,h3{font-family:Charter,"Iowan Old Style",Georgia,serif;font-weight:600;line-height:1.2;text-wrap:balance;letter-spacing:-.01em}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
#gate form{background:var(--karta);padding:32px;width:100%;max-width:420px;border:1px solid var(--linia);border-radius:6px;box-shadow:0 12px 40px -18px rgba(20,40,30,.35)}
#gate h1{font-size:24px;margin:0 0 6px}#gate p{margin:0 0 18px;color:var(--szary);font-size:15px}
input[type=password]{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--linia);border-radius:4px;background:var(--tlo);color:var(--tekst)}
#gate label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--szary);margin-top:12px}#gate input[type=checkbox]{accent-color:var(--akcent)}
#gate button{width:100%;margin-top:16px;font:inherit;font-weight:600;padding:12px;border:0;border-radius:4px;background:var(--akcent);color:var(--karta);cursor:pointer}
#msg{color:var(--ostr);font-size:14px;min-height:20px;margin-top:8px}
.uklad{max-width:1480px;margin:0 auto}
.bok{position:sticky;top:0;z-index:5;background:var(--tlo);border-bottom:1px solid var(--linia)}

.bok nav{display:flex;gap:4px;overflow-x:auto;white-space:nowrap;padding:8px 12px;scrollbar-width:none}
.bok nav a{text-decoration:none;color:var(--szary);font-weight:600;font-size:14px;padding:6px 10px;border-radius:4px}
.bok nav a:hover{color:var(--tekst);background:var(--pole)}.bok nav a.tu{color:var(--akcent);background:var(--akcent-tlo)}
main{padding:8px 16px 80px;min-width:0}
header h1{font-size:clamp(26px,3.2vw,40px);margin:28px 0 10px}header>p{margin:0;max-width:68ch;color:var(--szary);font-size:17px}
.fakty{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--linia);border:1px solid var(--linia);border-radius:6px;overflow:hidden;margin:22px 0 0}
.fakty div{background:var(--karta);padding:12px 16px}.fakty dt{font-size:13px;color:var(--szary)}.fakty dd{margin:2px 0 0;font-weight:600;font-size:17px}
section{margin-top:52px}h2{font-size:clamp(22px,2.2vw,28px);margin:0 0 6px}h3{font-size:19px;margin:30px 0 10px}
.wstep{margin:0 0 18px;color:var(--szary);max-width:72ch}
.dok{list-style:none;margin:0;padding:0;background:var(--karta);border:1px solid var(--linia);border-radius:6px}
.dok li{display:grid;grid-template-columns:1fr;gap:6px;padding:16px 18px;border-top:1px solid var(--linia)}.dok li:first-child{border-top:0}
.dok li:hover{background:color-mix(in srgb,var(--pole) 45%,transparent)}
.rodz{display:flex;gap:8px;align-items:baseline;font-size:12.5px;font-weight:650;color:var(--miedz);letter-spacing:.01em}.rodz time{font-weight:500;color:var(--szary)}
.opis{display:flex;flex-direction:column;gap:4px;min-width:0}.opis b{font-weight:650;font-size:16.5px;line-height:1.35}.opis small{color:var(--szary);font-size:14.5px;line-height:1.5;max-width:78ch}
.dok a[data-f],.dok .brak{justify-self:start;align-self:center;font-weight:600;font-size:14px;text-decoration:none;border-radius:4px;padding:9px 14px;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.dok a[data-f]{background:var(--akcent-tlo);color:var(--akcent);transition:background .2s,color .2s}
.dok a[data-f]::before{content:"";width:12px;height:14px;background:currentColor;-webkit-mask:var(--pdf) center/contain no-repeat;mask:var(--pdf) center/contain no-repeat}
.dok a[data-f]:hover{background:var(--akcent);color:var(--karta)}.dok a[data-f].ladowanie{opacity:.5;pointer-events:none}
.dok .brak{color:var(--szary);border:1px dashed var(--linia)}
.dok .tag{margin:2px 0;align-self:flex-start}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:3px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.tag.tak{background:var(--akcent-tlo);color:var(--akcent)}.tag.nie{background:var(--ostr-tlo);color:var(--ostr)}
.karta{background:var(--zolty-tlo);border-radius:6px;padding:16px 20px;margin:18px 0;max-width:90ch}.karta.wazne{background:var(--ostr-tlo)}
.karta p{margin:4px 0}.karta ul{margin:4px 0;padding-left:20px}.karta li{margin:4px 0}
.tab{overflow-x:auto;background:var(--karta);border:1px solid var(--linia);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:15px}th,td{text-align:left;vertical-align:top;padding:10px 16px;border-top:1px solid var(--linia)}
th{font-size:13px;color:var(--szary);font-weight:600;border-top:0;background:var(--pole)}td:first-child{white-space:nowrap;font-weight:600;color:var(--akcent);width:1%}
footer{margin-top:56px;font-size:13px;color:var(--szary);border-top:1px solid var(--linia);padding-top:14px;max-width:90ch}

 .rodz{flex-direction:column;gap:2px;padding-top:2px}.dok a[data-f],.dok .brak{align-self:start}}

 .bok nav{flex-direction:column;padding:0;white-space:normal;overflow:visible;gap:2px}.bok nav a{font-size:15px;padding:8px 10px}

.decyzje{background:var(--karta);border:1px solid var(--linia);border-radius:6px;padding:20px 24px;margin:0 0 20px}
.decyzje h3{margin:0 0 10px;font-size:20px}.decyzje ol{margin:0;padding:0;list-style:none;counter-reset:d;display:grid;gap:12px}

.decyzje ol li::before{content:counter(d);width:26px;height:26px;border-radius:50%;background:var(--akcent);color:var(--karta);font-weight:700;font-size:13px;display:grid;place-items:center;position:absolute;left:0;top:0}

.szukaj{display:flex;align-items:center;gap:8px;background:var(--karta);border:1px solid var(--linia);border-radius:5px;padding:0 10px}
.szukaj:focus-within{border-color:var(--akcent)}.szukaj svg{width:16px;height:16px;fill:none;stroke:var(--szary);stroke-width:1.8;stroke-linecap:round;flex:none}
.szukaj input{border:0;background:none;font:inherit;font-size:15px;color:var(--tekst);padding:9px 0;width:100%;min-width:0;outline:none}
#motyw{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:13px;font-weight:600;color:var(--szary);background:none;border:1px solid var(--linia);border-radius:5px;padding:6px 10px;cursor:pointer}
#motyw:hover{color:var(--tekst)}#motyw svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6}#motyw .pel{fill:currentColor;stroke:none}
#pusto{margin:40px 0;color:var(--szary)}mark{background:var(--zolty-tlo);color:inherit;padding:0 1px;border-radius:2px}

.bok{display:grid;grid-template-columns:1fr auto;gap:8px 10px;padding:10px 16px 0}
.marka{display:flex;align-items:center;gap:10px}.marka .mt{display:flex;flex-direction:column}.marka b{font-family:Charter,"Iowan Old Style",Georgia,serif;font-size:16px;line-height:1.2}.marka .mt span{font-size:12px;color:var(--szary)}

.meta{font-size:12.5px;color:var(--szary)}

.sedno{background:var(--akcent-tlo);border-radius:6px;padding:16px 20px;margin:0 0 8px;max-width:92ch}.sedno p{margin:0;font-size:16.5px}
.schemat{display:grid;gap:6px;justify-items:center;margin:4px 0 8px}
.wezel{background:var(--karta);border:1px solid var(--linia);border-radius:6px;padding:12px 16px;width:min(100%,560px);text-align:center}
.wezel[gl]{border-color:var(--akcent);box-shadow:inset 0 0 0 1px var(--akcent)}
.wezel b{display:block;font-size:16px}.wezel span{display:block;color:var(--szary);font-size:14px;margin-top:2px}
.strz{font-size:13px;color:var(--miedz);font-weight:600;text-align:center}
.schemat .dwa{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(100%,760px)}.schemat .dwa .wezel{width:100%}
.os{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--linia);display:grid;gap:10px;max-width:92ch}
.os li{position:relative;padding-left:14px}.os li::before{content:"";position:absolute;left:-25px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--tlo);border:2px solid var(--akcent)}

.os li.teraz::before{background:var(--ostr);border-color:var(--ostr);width:12px;height:12px;left:-26px}.os li.teraz time{color:var(--ostr)}

.granice>div{background:var(--karta);border:1px solid var(--linia);border-radius:6px;padding:14px 16px}.granice b{font-size:16px}.granice p{margin:6px 0 0;color:var(--szary);font-size:14.5px}
.kroki{margin:0 0 14px;padding-left:22px;display:grid;gap:8px;max-width:92ch}
#koncepcja .dok{margin-top:14px}
@media(max-width:600px){.schemat .dwa{grid-template-columns:1fr}.os time{display:block;min-width:0}}
.dok .link{justify-self:start;font:600 13px inherit;font-family:inherit;color:var(--szary);background:none;border:1px solid var(--linia);border-radius:4px;padding:7px 10px;cursor:pointer}.dok .link:hover{color:var(--akcent);border-color:var(--akcent)}
@media(min-width:760px){.dok li{grid-template-columns:150px minmax(0,1fr) auto auto}.dok .link{align-self:start}}
.dok li.wskazany{background:var(--zolty-tlo);box-shadow:inset 3px 0 0 var(--akcent2)}
